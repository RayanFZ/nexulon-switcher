name: Bug report
description: Something in Nexulon Switcher is broken or behaves unexpectedly.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **do not** attach saved login folders,
        `RiotGamesPrivateSettings.yaml`, browser profiles or tokens — they are
        credentials. Redact account names if you prefer not to share them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nexulon Switcher version
      description: Shown in the About panel.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - MSI installer
        - Portable exe
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt (optional)
      description: "From `%APPDATA%\\Nexulon Switcher\\logs\\nexulon-switcher.log`."
      render: text
    validations:
      required: false
