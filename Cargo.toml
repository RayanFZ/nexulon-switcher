[package]
name = "nexulon-switcher"
version = "1.0.0"
edition = "2024"
description = "Fast, native Rust account switcher for game launchers, browsers and desktop apps"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/RayanFZ/nexulon-switcher"
authors = ["Nexulon Corp"]

[dependencies]
base64 = "0.23.1"
glob = "0.3.4"
regex = "1.13.1"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tao = "0.37.2"
winreg = "0.56.0"
wry = "0.57.1"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
